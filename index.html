<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Business Idea Generator</title>
  <meta name="description" content="Tap to reveal fresh business ideas. No repeats. Copy or share instantly.">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --btn-bg: #1e293b;
      --btn-hover: #334155;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font);
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .card {
      width: 100%;
      min-height: 280px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 35px var(--accent-glow);
      transform: translateY(-2px);
    }

    .card:active {
      transform: scale(0.985);
    }

    .idea-text {
      font-size: 1.55rem;
      line-height: 1.45;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.01em;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .idea-text.fade {
      opacity: 0;
      transform: translateY(8px);
    }

    .tap-hint {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }

    .btn {
      flex: 1;
      padding: 14px 20px;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .counter {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 32px;
      background: #0f172a;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">💡 Fresh Ideas · Zero Repeats</div>

    <div class="card" id="ideaCard" title="Tap to generate new idea">
      <div class="idea-text" id="ideaText">Loading your first idea...</div>
      <div class="tap-hint">👆 Tap anywhere on card for next idea</div>
    </div>

    <div class="actions">
      <button class="btn" id="copyBtn">
        📋 Copy Idea
      </button>
      <button class="btn" id="shareBtn">
        📤 Share Idea
      </button>
    </div>

    <div class="counter" id="counterText">Idea 1 of 10,000+ (Zero repeats)</div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    let ideasPool = [];
    let seenIndices = new Set();
    let totalShownCount = 0;

    // Rich dynamic combinatorial generators for endless new ideas
    const actionStarters = [
      "On-demand mobile EV rapid-charging van with battery boosters",
      "Subscription-based deep home sanitization and allergen extraction",
      "Doorstep electric two-wheeler brake, motor & battery service clinic",
      "Accompanied hospital transit and healthcare paperwork concierge",
      "Autonomous rooftop solar panel dry-cleaning & efficiency monitoring",
      "Underground water tank robotic silt cleaning and UV disinfection",
      "Curated direct-from-farmer indigenous spice and cold-pressed oil box",
      "Turnkey Airbnb interior styling, dynamic occupancy pricing and upkeep",
      "Soundproof modular acoustic study and podcast booth rental",
      "Smart medicine expiry alert and auto-markdown system for pharmacies",
      "B2B surplus food rescue platform connecting banquets to bio-energy plants",
      "Zero-emission refrigerated cargo e-bike distribution fleet",
      "Automated fresh breakfast and regional culinary vending kiosks",
      "Doorstep luxury sneaker de-oxidation, restoration and leather care",
      "Industrial uniform and cleanroom sterilization laundry service",
      "Campus shared solar-docked electric cycle leasing program",
      "Smart acoustic ultrasonic water pipe leak & wastage sensor network",
      "Pre-cut, pre-washed organic regional cooking vegetable delivery",
      "Mobile automotive windshield crack repair and optical resin curing",
      "Biophilic living vertical moss wall and indoor plant doctor service"
    ];

    const targetAudiences = [
      "for fast-growing tech corridor office campuses and startups",
      "for high-density residential towers and gated communities",
      "for elderly citizens living independently from overseas children",
      "for remote software engineers and work-from-home creators",
      "for local neighborhood pharmacies and independent retailers",
      "for cloud kitchens and boutique farm-to-table restaurants",
      "for marathon runners, CrossFit athletes and fitness coaches",
      "for dual-income busy parents managing young children",
      "for suburban homeowners seeking zero-down clean energy",
      "for boutique short-term rental and homestay operators"
    ];

    const keyDifferentiators = [
      "guaranteeing sub-20 minute technician doorstep arrival.",
      "featuring automated IoT replenishments with zero manual ordering.",
      "delivering zero tailpipe emissions with 100% solar micro-charging.",
      "using circular, plastic-free stainless steel returnable containers.",
      "calibrated directly to real-time wearable biometric health data.",
      "backed by a 1-year comprehensive satisfaction and replacement warranty.",
      "delivered daily before 6:30 AM right outside the front door.",
      "with full insurance claim liaison and cashless medical processing.",
      "operating 100% offline-first with regional voice-first navigation.",
      "certified organic with batch provenance traceable to individual farmers."
    ];

    const ideaText = document.getElementById("ideaText");
    const ideaCard = document.getElementById("ideaCard");
    const copyBtn = document.getElementById("copyBtn");
    const shareBtn = document.getElementById("shareBtn");
    const counterText = document.getElementById("counterText");
    const toast = document.getElementById("toast");

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function generateDynamicIdea() {
      const a = actionStarters[Math.floor(Math.random() * actionStarters.length)];
      const t = targetAudiences[Math.floor(Math.random() * targetAudiences.length)];
      const d = keyDifferentiators[Math.floor(Math.random() * keyDifferentiators.length)];
      return `${a} ${t}, ${d}`;
    }

    async function loadIdeas() {
      try {
        const res = await fetch("ideas.json");
        ideasPool = await res.json();
      } catch (e) {
        ideasPool = [
          "On-demand mobile EV charging van servicing stranded cars in IT corridors.",
          "Subscription-based deep home cleaning and upholstery sanitization for tier-2 city apartments.",
          "Curated regional pickle and indigenous spice subscription boxes sourced directly from village cooperatives.",
          "B2B zero-waste compost collection and organic fertilizer return service for apartment societies.",
          "Pre-cut, pre-washed organic regional cooking vegetable boxes delivered daily at 6 AM."
        ];
      }

      // Load seen history from localStorage using compact index arrays
      try {
        const stored = localStorage.getItem("seen_idea_indices_v2");
        if (stored) {
          seenIndices = new Set(JSON.parse(stored));
        }
      } catch (err) {
        seenIndices = new Set();
      }

      displayNextIdea();
    }

    function displayNextIdea() {
      let chosenIdea = "";

      // Check if we still have unseen ideas in our massive database
      if (ideasPool.length > 0 && seenIndices.size < ideasPool.length) {
        let randIdx;
        let attempts = 0;
        do {
          randIdx = Math.floor(Math.random() * ideasPool.length);
          attempts++;
        } while (seenIndices.has(randIdx) && attempts < 200);

        if (seenIndices.has(randIdx)) {
          for (let i = 0; i < ideasPool.length; i++) {
            if (!seenIndices.has(i)) {
              randIdx = i;
              break;
            }
          }
        }

        seenIndices.add(randIdx);
        chosenIdea = ideasPool[randIdx];

        try {
          localStorage.setItem("seen_idea_indices_v2", JSON.stringify(Array.from(seenIndices)));
        } catch (e) {}
      } else {
        // Dynamic procedural synthesis if all static ideas have been exhausted
        chosenIdea = generateDynamicIdea();
      }

      totalShownCount++;

      ideaText.classList.add("fade");
      setTimeout(() => {
        ideaText.textContent = chosenIdea;
        ideaText.classList.remove("fade");

        const displayTotal = ideasPool.length > 0 ? ideasPool.length.toLocaleString() : "10,000";
        const currentCount = seenIndices.size > 0 ? seenIndices.size.toLocaleString() : totalShownCount.toLocaleString();
        counterText.textContent = `Idea ${currentCount} explored of ${displayTotal}+ (Zero repeats)`;
      }, 150);
    }

    // Tap card for next idea
    ideaCard.addEventListener("click", displayNextIdea);

    // Copy to clipboard
    copyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const text = ideaText.textContent;
      if (!text || text.includes("Loading")) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast("Copied idea to clipboard! 📋");
      }).catch(() => {
        showToast("Press Ctrl+C to copy");
      });
    });

    // Native Web Share or fallback
    shareBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const text = ideaText.textContent;
      if (!text || text.includes("Loading")) return;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "Business Idea",
            text: `💡 Business Idea: "${text}"`,
            url: window.location.href
          });
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(`💡 Business Idea: "${text}" - ${window.location.href}`);
        showToast("Link and idea copied to share! 🚀");
      }
    });

    // Load ideas on startup
    loadIdeas();
  </script>
</body>
</html>
