name: Daily Extraction & Site Build

on:
  schedule:
    # Runs 3 times a day at 03:30, 08:30, and 13:30 UTC (09:00, 14:00, 19:00 IST)
    - cron: '30 3,8,13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Extraction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m pipeline.run_pipeline --max-articles 5

      - name: Run Static Site Builder
        run: |
          python build_site.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ state/ site/
          if git diff --staged --quiet; then
            echo "No changes detected. Nothing to commit."
          else
            git commit -m "Auto-update business cases, summaries, and static site [skip ci]"
            git push
          fi
